name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build map
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: python scripts/build_map.py --public

      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # build_map.py may rewrite routes_cache / trips.geojson in the worktree.
          # Preserve the built site, then reset so checkout to gh-pages can proceed.
          mkdir -p /tmp/pages-deploy
          cp output/index.html /tmp/pages-deploy/index.html
          test -s /tmp/pages-deploy/index.html

          git reset --hard HEAD
          git clean -fd
          git fetch origin gh-pages
          git checkout gh-pages

          cp /tmp/pages-deploy/index.html index.html
          git add index.html
          if git diff --staged --quiet; then
            echo "No site changes to deploy"
          else
            git commit -m "Deploy from ${GITHUB_SHA::7}"
            git push origin gh-pages
          fi
