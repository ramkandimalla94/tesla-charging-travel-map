name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build map
        env:
          # Public Mapbox token (pk.…) — embedded as base64 in index.html so the
          # live demo launches without a paste prompt, without tripping GitHub
          # push protection on gh-pages (literal tokens are blocked).
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          if [ -z "${MAPBOX_TOKEN}" ]; then
            echo "MAPBOX_TOKEN secret is empty — set it in repo Settings → Secrets"
            exit 1
          fi
          if [[ "${MAPBOX_TOKEN}" == sk.* ]]; then
            echo "MAPBOX_TOKEN must be a public token (pk.…), not a secret token (sk.…)"
            exit 1
          fi
          python scripts/build_map.py --public
          # Confirm embed is base64 (not a raw pk./sk. string GitHub would reject)
          python - <<'PY'
          import base64, pathlib, re, sys
          html = pathlib.Path("output/index.html").read_text(encoding="utf-8")
          if re.search(r"\b(?:pk|sk)\.eyJ[A-Za-z0-9_-]{10,}", html):
              sys.exit("raw Mapbox token found in index.html — refuse deploy")
          m = re.search(r'MAPBOX_TOKEN_B64 = "([A-Za-z0-9+/=]+)"', html)
          if not m:
              sys.exit("MAPBOX_TOKEN_B64 missing from index.html")
          token = base64.b64decode(m.group(1)).decode("utf-8")
          if not token.startswith("pk."):
              sys.exit(f"decoded token does not start with pk.: {token[:8]!r}")
          print(f"Pages embed OK — base64 public token ({len(token)} chars)")
          PY

      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve the built site, then reset so checkout to gh-pages can proceed.
          mkdir -p /tmp/pages-deploy
          cp output/index.html /tmp/pages-deploy/index.html
          test -s /tmp/pages-deploy/index.html
          if [ -d output/photos ]; then
            rm -rf /tmp/pages-deploy/photos
            cp -a output/photos /tmp/pages-deploy/photos
          fi

          git reset --hard HEAD
          git clean -fd
          git fetch origin gh-pages
          git checkout gh-pages

          cp /tmp/pages-deploy/index.html index.html
          git add index.html
          if [ -d /tmp/pages-deploy/photos ]; then
            rm -rf photos
            cp -a /tmp/pages-deploy/photos photos
            git add -A photos
          fi
          if git diff --staged --quiet; then
            echo "No site changes to deploy"
          else
            git commit -m "Deploy from ${GITHUB_SHA::7}"
            git push origin gh-pages
          fi
